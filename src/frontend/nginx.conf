server {
  listen 5183;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads (cover images, routine and material PDFs) exceed nginx's 1 MB default.
  client_max_body_size 20m;

  # Everything under these two prefixes belongs to the API. Proxying keeps the
  # browser on a single origin, so the httpOnly cookie is sent automatically.
  location /api/ {
    proxy_pass http://api:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://api:8810;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Content-hashed bundles never change under the same name.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # The shell must never be cached, or a deploy serves stale asset references.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Client-side routing: unknown paths are the SPA's business, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
