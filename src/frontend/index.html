<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The page title is replaced per route by usePageTitle(); this is what
         shows before the app mounts and for crawlers that do not run JS. -->
    <title>University of South Asia — Community Portal</title>
    <meta
      name="description"
      content="Notices, exam routines, class notes and campus writing from the University of South Asia, published by students and staff."
    />
    <meta name="theme-color" content="#a80000" />

    <!-- favicon.ico is listed first for browsers that request it by name;
         the PNG sizes let modern browsers pick a crisp one. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
